name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          # Tag "v1.2.3" -> Version 1.2.3, sonst Entwicklungsversion
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build "Prozessor Affinity Manager.sln" -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Prozessor-Affinity-Manager-Setup
          path: installer/Output/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
